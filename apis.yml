aid: homegp
name: HomeGP
description: HomeGP is a Malaysian on-demand house-call healthcare platform, founded in 2015 and headquartered
  in Kuala Lumpur, that connects patients with a network of over 300 vetted healthcare practitioners who
  visit them at home. Services include general practitioner consultations, homecare nursing, licensed
  physiotherapy, blood and urine testing, medical concierge, wound dressing, and private and live-in
  caregivers. Bookings are placed through WhatsApp with confirmation typically within ten minutes, operating
  Monday to Saturday 8am-10pm. HomeGP positions itself as a marketplace connecting individuals to independent
  professionals rather than a healthcare provider itself, and is backed by 500 Global (500 Southeast Asia),
  8capita, and IncuVest.
